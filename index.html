<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080c14" />
    <meta name="color-scheme" content="dark" />
    <title>Drabyashree NEPSE</title>
    <!-- Dark Background and Instant Pre-Boot Splash Styling -->
    <style>
      html, body {
        background-color: #080c14 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      #app-pre-boot {
        position: fixed;
        inset: 0;
        background-color: #080c14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      .pre-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .pre-boot-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.25);
        margin-bottom: 16px;
      }
      .pre-boot-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 18px;
      }
      .pre-boot-title {
        font-size: 19px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .pre-boot-sub {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .pre-boot-spinner {
        width: 26px;
        height: 26px;
        border: 2.5px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: preboot-spin 0.7s linear infinite;
      }
      @keyframes preboot-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark text-white font-sans overflow-x-hidden antialiased" style="background-color: #080c14;">
    <div id="root">
      <div id="app-pre-boot">
        <div class="pre-boot-card">
          <div class="pre-boot-logo">
            <img src="/logo.png" alt="Drabyashree NEPSE" width="72" height="72" />
          </div>
          <div class="pre-boot-title">Drabyashree NEPSE</div>
          <div class="pre-boot-sub">Institutional Terminal</div>
          <div class="pre-boot-spinner"></div>
        </div>
      </div>
    </div>
    <script>
      // Only warn if opened directly in an external desktop browser via file:// (not Electron, not Capacitor)
      if (window.location.protocol === 'file:' && !navigator.userAgent.includes('Electron') && !window.Capacitor) {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            root.innerHTML = '<div style="background:#0B0E14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;">' +
              '<div style="font-size:42px;margin-bottom:12px;">📈</div>' +
              '<h2 style="color:#5b5ef4;margin-bottom:8px;">Drabyashree NEPSE</h2>' +
              '<p style="color:#94a3b8;max-width:440px;font-size:13px;line-height:1.6;">' +
              'Browsers block JavaScript modules when opening files directly via <b>file://</b>.<br><br>' +
              'To run on desktop, double-click <b>Launch-NEPSE-App.bat</b> or run <b>npm run dev</b>.<br>' +
              'To run on mobile, install <b>Drabyashree-NEPSE-release.apk</b>.' +
              '</p></div>';
          }
        }, 3000);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
